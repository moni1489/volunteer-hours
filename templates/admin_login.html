{% extends "base.html" %}
{% block title %}{{ _("admin_login.title") }}{% endblock %}
{% block page_class %}narrow{% endblock %}
{% block content %}
<div class="card">
  <h1>{{ _("admin_login.title") }}</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('admin.login') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="login">{{ _("field.login") }}</label>
    <input id="login" name="login" type="text" required autocomplete="username">
    <label for="password">{{ _("field.password") }}</label>
    <input id="password" name="password" type="password" required autocomplete="current-password">
    <button type="submit" class="btn-primary btn-block">{{ _("code.submit") }}</button>
  </form>
</div>
{% endblock %}
