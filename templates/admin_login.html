<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход администратора</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #fff; color: #111; }
    main { max-width: 420px; margin: 40px auto; }
    input { width: 100%; box-sizing: border-box; padding: 10px; font-size: 16px; margin: 6px 0 12px; }
    button { padding: 10px 16px; font-size: 16px; cursor: pointer; }
    .error { color: #b00020; margin-bottom: 12px; }
  </style>
</head>
<body>
  <main>
    <h1>Вход администратора</h1>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post" action="{{ url_for('admin.login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="login">Логин</label>
      <input id="login" name="login" type="text" required autocomplete="username">
      <label for="password">Пароль</label>
      <input id="password" name="password" type="password" required autocomplete="current-password">
      <button type="submit">Войти</button>
    </form>
  </main>
</body>
</html>
