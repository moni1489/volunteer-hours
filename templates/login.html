<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход ученика</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #fff; color: #111; }
    main { max-width: 420px; margin: 40px auto; }
    input { width: 100%; box-sizing: border-box; padding: 10px; font-size: 16px; margin: 6px 0 12px; }
    button { padding: 10px 16px; font-size: 16px; cursor: pointer; }
    .error { color: #b00020; margin-bottom: 12px; }
  </style>
</head>
<body>
  <main>
    <h1>Вход ученика</h1>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post" action="{{ url_for('auth.login') }}">
      <label for="email">Школьный email</label>
      <input id="email" name="email" type="email" required autocomplete="email">
      <button type="submit">Получить код</button>
    </form>
  </main>
</body>
</html>
