<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Код входа</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #fff; color: #111; }
    main { max-width: 420px; margin: 40px auto; }
    input { width: 100%; box-sizing: border-box; padding: 10px; font-size: 16px; margin: 6px 0 12px; letter-spacing: 4px; }
    button { padding: 10px 16px; font-size: 16px; cursor: pointer; }
    .error { color: #b00020; margin-bottom: 12px; }
  </style>
</head>
<body>
  <main>
    <h1>Введите код</h1>
    <p>Мы отправили 6-значный код на {{ email }}. Код действует 10 минут.</p>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post" action="{{ url_for('auth.login_code') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="code">Код</label>
      <input id="code" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autocomplete="one-time-code">
      <button type="submit">Войти</button>
    </form>
    <p><a href="{{ url_for('auth.login') }}">Запросить код заново</a></p>
  </main>
</body>
</html>
