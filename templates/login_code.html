{% extends "base.html" %}
{% block title %}Код входа{% endblock %}
{% block page_class %}narrow{% endblock %}
{% block content %}
<div class="card">
  <h1>Введите код</h1>
  <p class="muted">Мы отправили 6-значный код на {{ email }}. Код действует 10 минут.</p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('auth.login_code') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="code">Код</label>
    <input id="code" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autocomplete="one-time-code" class="code-input">
    <button type="submit" class="btn-primary btn-block">Войти</button>
  </form>
  <p><a href="{{ url_for('auth.login') }}">Запросить код заново</a></p>
</div>
{% endblock %}
