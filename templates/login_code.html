{% extends "base.html" %}
{% block title %}{{ _("code.page_title") }}{% endblock %}
{% block page_class %}narrow{% endblock %}
{% block content %}
<div class="card">
  <h1>{{ _("code.title") }}</h1>
  <p class="muted">{{ _("code.sent", email=email) }}</p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('auth.login_code') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="code">{{ _("code.label") }}</label>
    <input id="code" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autocomplete="one-time-code" class="code-input">
    <button type="submit" class="btn-primary btn-block">{{ _("code.submit") }}</button>
  </form>
  <p><a href="{{ url_for('auth.login') }}">{{ _("code.request_again") }}</a></p>
</div>
{% endblock %}
